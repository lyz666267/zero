name: CI Test Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # =========================================================================
  # Job 1: Backend — Spring Boot 3.3 + Maven + JDK 17
  # =========================================================================
  backend:
    name: Backend (Spring Boot + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-testdata-platform/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests (with JaCoCo coverage)
        run: mvn test -B

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: smart-testdata-platform/backend/target/site/jacoco/

  # =========================================================================
  # Job 2: Python AI Service — FastAPI + Pytest + Python 3.12
  # =========================================================================
  python:
    name: Python AI Service (FastAPI + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-testdata-platform/ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: smart-testdata-platform/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (with coverage)
        run: pytest tests -v --cov=app --cov-report=html --cov-report=term-missing

      - name: Upload pytest coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-report
          path: smart-testdata-platform/ai-service/htmlcov/

  # =========================================================================
  # Job 3: Frontend — Vue 3 + Vite + Vitest + Node 20
  # =========================================================================
  frontend:
    name: Frontend (Vue 3 + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-testdata-platform/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: smart-testdata-platform/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Run vitest
        run: npm run test
