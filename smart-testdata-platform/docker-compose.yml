services:
  # ============================================================
  # MySQL 8.0 — 平台元数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: platform_db
      MYSQL_USER: platform
      MYSQL_PASSWORD: platform123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/mysql-init:/docker-entrypoint-initdb.d   # 初始化脚本
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-net

  # ============================================================
  # Nginx — 前端静态服务 + 反向代理
  # ============================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: platform-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    # depends_on:
    #   - backend  # 注释：backend 开发阶段由 IDE 启动
    networks:
      - platform-net

  # ============================================================
  # Java 后端（开发阶段由 IDE/Maven 启动，此处为容器化参考）
  # ============================================================
  # backend:
  #   build: ./backend
  #   container_name: platform-backend
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/platform_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
  #     SPRING_DATASOURCE_USERNAME: platform
  #     SPRING_DATASOURCE_PASSWORD: platform123
  #     AI_SERVICE_URL: http://ai-service:8000
  #     TZ: Asia/Shanghai
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - platform-net

  # ============================================================
  # Python AI 服务（开发阶段由 uvicorn 启动，此处为容器化参考）
  # ============================================================
  # ai-service:
  #   build: ./ai-service
  #   container_name: platform-ai
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
  #     QWEN_API_KEY: ${QWEN_API_KEY}
  #     TZ: Asia/Shanghai
  #   networks:
  #     - platform-net

volumes:
  mysql_data:
    driver: local

networks:
  platform-net:
    driver: bridge
