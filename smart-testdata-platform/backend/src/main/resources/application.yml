server:
  port: 8088

spring:
  application:
    name: smart-testdata-platform

  # 平台数据库（MySQL）
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/platform_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: platform
    password: platform123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

  # Jackson 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AI 服务地址
platform:
  ai-service:
    url: http://localhost:8000
  datasource:
    aes-key: ${AES_KEY}  # 数据源密码 AES 加密密钥（16字节，须通过环境变量注入）

# JWT 配置
jwt:
  secret: ${JWT_SECRET}  # 须通过环境变量注入
  expiration: 86400000  # 24小时

# 日志级别
logging:
  level:
    com.platform: INFO
    com.platform.mapper: WARN
    org.springframework.security: INFO
