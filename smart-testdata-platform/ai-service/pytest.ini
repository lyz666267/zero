[pytest]
# pytest 配置文件 — AI Service
# Python 路径
pythonpath = .

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# asyncio 模式（兼容 async 测试）
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 测试标记
markers =
    asyncio: 异步测试
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70
